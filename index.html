<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSDA-Doom WebLauncher + Console Diagnostics</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { margin: 5px 0; font-size: 1.5rem; }
        .controls {
            margin-bottom: 15px;
            background: #222;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #444;
        }
        select, input, button {
            padding: 6px;
            margin: 5px;
            background: #333;
            color: white;
            border: 1px solid #555;
            border-radius: 4px;
        }
        button { background: #a00; cursor: pointer; font-weight: bold; }
        button:hover { background: #c00; }
        #canvas-container { border: 4px solid #333; background-color: #000; }
        canvas { display: block; image-rendering: pixelated; }
        
        /* Engine log output box */
        #output-terminal {
            width: 640px;
            height: 150px;
            margin-top: 10px;
            background-color: #000;
            color: #0f0;
            font-family: monospace;
            font-size: 11px;
            padding: 8px;
            overflow-y: scroll;
            white-space: pre-wrap;
            border: 1px solid #333;
            text-align: left;
        }
    </style>
</head>
<body>

    <h1>DSDA-Doom WebLauncher</h1>
    
    <div class="controls">
        <select id="iwad-select">
            <option value="doom2.wad">Doom II (doom2.wad)</option>
            <option value="doom.wad">Doom Registered (doom.wad)</option>
            <option value="doomu.wad">The Ultimate Doom (doomu.wad)</option>
            <option value="plutonia.wad">The Plutonia Experiment (plutonia.wad)</option>
            <option value="tnt.wad">TNT: Evilution (tnt.wad)</option>
        </select>
        <input type="text" id="pwad-input" placeholder="Custom PWAD (Optional)">
        <button id="launch-btn" onclick="launchGame()">Launch Game</button>
    </div>
    
    <div id="canvas-container">
        <canvas id="canvas" width="1280" height="720" oncontextmenu="event.preventDefault()"></canvas>
    </div>

    <div id="output-terminal">--- Engine System Log Console ---&#10;</div>

    <script type="text/javascript">
        var terminal = document.getElementById('output-terminal');

        var Module = {
            preRun: [],
            postRun: [],
            canvas: (function() {
                var canvas = document.getElementById('canvas');
                
                // FORCE POINTER LOCK ON CLICK:
                // When you click inside the running game canvas, this commands the browser 
                // to completely hide the cursor and pass raw hardware inputs straight into the engine.
                canvas.addEventListener("click", function() {
                    canvas.requestPointerLock = canvas.requestPointerLock || 
                                                canvas.mozRequestPointerLock || 
                                                canvas.webkitRequestPointerLock;
                    if (canvas.requestPointerLock) {
                        canvas.requestPointerLock();
                    }
                });

                return canvas;
            })(),
            print: function(text) {
                console.log(text);
                terminal.textContent += text + "\n";
                terminal.scrollTop = terminal.scrollHeight; // Auto scroll to bottom
            },
            printErr: function(text) {
                console.error(text);
                terminal.textContent += "[ERROR] " + text + "\n";
                terminal.scrollTop = terminal.scrollHeight;
            }
        };

        function launchGame() {
            var iwad = document.getElementById('iwad-select').value;
            var pwad = document.getElementById('pwad-input').value.trim().toLowerCase();
            
            document.getElementById('launch-btn').disabled = true;
            terminal.textContent += "[WEB] Preloading system and game assets into virtual RAM...\n";

            Module.preRun.push(function() {
                // 1. Preload the essential system asset file so the engine can read its fonts/menus
                FS.createPreloadedFile('/', 'dsda-doom.wad', 'dsda-doom.wad', true, false);

                // 2. Preload the core game file (e.g., doom.wad)
                FS.createPreloadedFile('/', iwad, iwad, true, false);
                
                // 3. Preload custom files if specified
                if (pwad) {
                    FS.createPreloadedFile('/', pwad, pwad, true, false);
                }
            });

            // CRITICAL SAFE-BOARDS: Force fallback options to bypass desktop rendering requirements
            var launchArgs = [
                "-iwad", iwad, 
                "-width", "1280", 
                "-height", "720",
                "-window",
            ];
            
            if (pwad) {
                launchArgs.push("-file", pwad);
            }
            
            Module.arguments = launchArgs;
            terminal.textContent += "[WEB] Launch arguments sent: " + JSON.stringify(launchArgs) + "\n";

            var script = document.createElement('script');
            script.src = "dsda-doom.js";
            script.async = true;
            document.body.appendChild(script);
        }
    </script>

</body>
</html>

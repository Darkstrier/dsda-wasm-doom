<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSDA-WASM-Doom</title>
    <style>
        body { background-color: #111; color: #fff; font-family: sans-serif; text-align: center; padding: 15px; }
        .logo-container { margin: 15px 0; }
        .logo-img { max-width: 400px; height: auto; display: inline-block; }
        .controls { background: #222; padding: 15px; border-radius: 5px; border: 1px solid #444; display: inline-block; margin-bottom: 15px; text-align: left; }
        .control-row { margin-bottom: 10px; }
        label { display: inline-block; width: 180px; font-weight: bold; }
        input, button { padding: 8px; background: #333; color: white; border: 1px solid #555; border-radius: 4px; }
        button { background: #a00; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        button:hover { background: #c00; }
        #canvas-container { border: 4px solid #333; background: #000; display: inline-block; position: relative; }
        canvas { display: block; image-rendering: pixelated; width: 854px; height: 480px; max-width: 100vw; }
        #fullscreen-btn { background: #444; color: #fff; font-size: 12px; padding: 4px 8px; position: absolute; bottom: 10px; right: 10px; width: auto; margin: 0; opacity: 0.6; }
        #fullscreen-btn:hover { background: #666; opacity: 1.0; }
        #output-terminal { width: 854px; height: 120px; margin: 10px auto; background: #000; color: #0f0; font-family: monospace; font-size: 11px; padding: 8px; overflow-y: scroll; white-space: pre-wrap; text-align: left; max-width: 100vw; box-sizing: border-box; }
    </style>
</head>
<body>

    <div class="logo-container">
        <img src="logo.png" class="logo-img">
    </div>
    
    <div class="controls">
        <div class="control-row">
            <label>Select IWAD *</label>
            <input type="file" id="iwad-file" accept=".wad">
        </div>
        <div class="control-row">
            <label>Select PWAD (optional)</label>
            <input type="file" id="pwad-file" accept=".wad">
        </div>
        <div class="control-row">
            <label>Upload Configuration</label>
            <input type="file" id="cfg-file" accept=".cfg">
        </div>
        <div class="control-row">
            <label>SoundFont (optional)</label>
            <input type="file" id="sf2-file" accept=".sf2">
        </div>
        <button id="launch-btn" onclick="processAndLaunch()">Launch Game</button>
    </div>
    <br>
    
    <div id="canvas-container">
        <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
        <button id="fullscreen-btn" onclick="toggleFullscreen()">Fullscreen</button>
    </div>

    <div id="output-terminal">--- Console ---&#10;</div>

    <script type="text/javascript">
        var terminal = document.getElementById('output-terminal');
        
        var iwadBuffer = null;
        var iwadName = "";
        var pwadBuffer = null;
        var pwadName = "";
        var cfgBuffer = null;
        var sf2Buffer = null;

        var Module = {
            preRun: [function() {
                terminal.textContent += "[web] Core file system ready. Mounting files...\n";
                FS.createPreloadedFile('/', 'dsda-doom.wad', './dsda-doom.bin', true, false);
                
                if (iwadBuffer) {
                    FS.writeFile('/' + iwadName, iwadBuffer);
                    terminal.textContent += "[web] Successfully mounted IWAD: " + iwadName + "\n";
                }
                
                if (pwadBuffer) {
                    FS.writeFile('/' + pwadName, pwadBuffer);
                    terminal.textContent += "[web] Successfully mounted PWAD: " + pwadName + "\n";
                }

                if (sf2Buffer) {
                    FS.writeFile('/soundfont.sf2', sf2Buffer);
                    terminal.textContent += "[web] High-quality SoundFont mounted into virtual space.\n";
                }

                if (cfgBuffer) {
                    FS.mkdirTree('/home/webuser/.dsda-doom');
                    FS.writeFile('/home/webuser/.dsda-doom/dsda-doom.cfg', cfgBuffer);
                    terminal.textContent += "[web] dsda-doom.cfg configuration mapped into user home workspace.\n";
                }
            }],
            postRun: [],
            canvas: (function() {
                var canvas = document.getElementById('canvas');
                canvas.addEventListener("click", function() {
                    if(canvas.requestPointerLock) canvas.requestPointerLock();
                });
                return canvas;
            })(),
            print: function(text) { terminal.textContent += text + "\n"; terminal.scrollTop = terminal.scrollHeight; },
            printErr: function(text) { terminal.textContent += "[err] " + text + "\n"; terminal.scrollTop = terminal.scrollHeight; }
        };

        var readLocalFile = function(elementId, isText, callback) {
            var input = document.getElementById(elementId);
            if (input.files.length === 0) {
                callback(null, "");
                return;
            }
            var file = input.files[0];
            var reader = new FileReader();
            reader.onload = function(e) {
                if (isText) {
                    callback(e.target.result, file.name.toLowerCase());
                } else {
                    callback(new Uint8Array(e.target.result), file.name.toLowerCase());
                }
            };
            if (isText) {
                reader.readAsText(file);
            } else {
                reader.readAsArrayBuffer(file);
            }
        };

        function processAndLaunch() {
            var iwadInput = document.getElementById('iwad-file');
            if(iwadInput.files.length === 0) {
                alert("Please select an IWAD from your computer first.");
                return;
            }

            document.getElementById('launch-btn').disabled = true;
            terminal.textContent += "[web] Reading local files into browser memory...\n";

            readLocalFile('iwad-file', false, function(iBuf, iName) {
                iwadBuffer = iBuf;
                iwadName = iName;

                readLocalFile('pwad-file', false, function(pBuf, pName) {
                    pwadBuffer = pBuf;
                    pwadName = pName;

                    readLocalFile('sf2-file', false, function(sBuf, sName) {
                        sf2Buffer = sBuf;

                        readLocalFile('cfg-file', true, function(cText, cName) {
                            var configLines = cText ? cText.split('\n') : [];
                            
                            var hasAspect = false;
                            var hasMidi = false;
                            var hasSF = false;

                            for (var i = 0; i < configLines.length; i++) {
                                var line = configLines[i].trim();
                                if (line.startsWith('aspect_ratio_correction')) {
                                    configLines[i] = 'aspect_ratio_correction         1';
                                    hasAspect = true;
                                } else if (line.startsWith('snd_midiplayer')) {
                                    configLines[i] = 'snd_midiplayer                  "fluidsynth"';
                                    hasMidi = true;
                                } else if (line.startsWith('snd_soundfont')) {
                                    configLines[i] = sf2Buffer ? 'snd_soundfont                   "soundfont.sf2"' : 'snd_soundfont                   ""';
                                    hasSF = true;
                                }
                            }

                            if (!hasAspect) configLines.push('aspect_ratio_correction         1');
                            if (!hasMidi) configLines.push('snd_midiplayer                  "fluidsynth"');
                            if (!hasSF) configLines.push(sf2Buffer ? 'snd_soundfont                   "soundfont.sf2"' : 'snd_soundfont                   ""');

                            cfgBuffer = new TextEncoder().encode(configLines.join('\n'));

                            var launchArgs = ["-iwad", iwadName, "-width", "854", "-height", "480", "-window"];
                            if (pwadName) {
                                launchArgs.push("-file", pwadName);
                            }
                            Module.arguments = launchArgs;

                            terminal.textContent += "[web] Downloading engine binaries and core assets\n";

                            var script = document.createElement('script');
                            script.src = "dsda-doom.js";
                            script.async = true;
                            document.body.appendChild(script);
                        });
                    });
                });
            });
        }

        function toggleFullscreen() {
            var container = document.getElementById('canvas-container');
            if (!document.fullscreenElement) {
                if (container.requestFullscreen) {
                    container.requestFullscreen();
                } else if (container.mozRequestFullScreen) {
                    container.mozRequestFullScreen();
                } else if (container.webkitRequestFullscreen) {
                    container.webkitRequestFullscreen();
                } else if (container.msRequestFullscreen) {
                    container.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }
    </script>

</body>
</html>

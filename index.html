<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSDA-Doom WebLauncher</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 { margin-bottom: 5px; font-size: 1.6rem; }
        .controls {
            margin-bottom: 15px;
            background: #222;
            padding: 10px 20px;
            border-radius: 5px;
            border: 1px solid #444;
        }
        select, input, button {
            padding: 8px;
            margin: 5px;
            background: #333;
            color: white;
            border: 1px solid #555;
            border-radius: 4px;
        }
        button {
            background: #a00;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #c00; }
        #canvas-container {
            border: 4px solid #333;
            background-color: #000;
        }
        canvas { display: block; image-rendering: pixelated; }
        #status { margin-top: 15px; color: #aaa; font-size: 0.9rem; }
    </style>
</head>
<body>

    <h1>DSDA-Doom WebLauncher</h1>
    
    <div class="controls">
        <label for="iwad-select">Choose Game (IWAD):</label>
        <select id="iwad-select">
            <option value="doom2.wad">Doom II (doom2.wad)</option>
            <option value="doom.wad">Doom Shareware / Registered (doom.wad)</option>
            <option value="doomu.wad">The Ultimate Doom (doomu.wad)</option>
            <option value="plutonia.wad">The Plutonia Experiment (plutonia.wad)</option>
            <option value="tnt.wad">TNT: Evilution (tnt.wad)</option>
        </select>

        <label for="pwad-input">Custom PWAD (Optional):</label>
        <input type="text" id="pwad-input" placeholder="e.g., eviternity.wad">

        <button id="launch-btn" onclick="launchGame()">Launch Game</button>
    </div>
    
    <div id="canvas-container">
        <canvas id="canvas" width="640" height="480" oncontextmenu="event.preventDefault()"></canvas>
    </div>

    <div id="status">Select your settings and click "Launch Game"</div>

    <script type="text/javascript">
        // Global placeholder for Emscripten Module
        var Module = {
            preRun: [],
            postRun: [],
            canvas: (function() {
                var canvas = document.getElementById('canvas');
                return canvas;
            })(),
            setStatus: function(text) {
                document.getElementById('status').innerHTML = text || "Engine Running.";
            }
        };

        function launchGame() {
            var iwad = document.getElementById('iwad-select').value;
            var pwad = document.getElementById('pwad-input').value.trim().toLowerCase();
            
            document.getElementById('launch-btn').disabled = true;
            Module.setStatus("Loading game files onto virtual drive...");

            // 1. Queue up the core game file to download into the memory filesystem
            Module.preRun.push(function() {
                FS.createPreloadedFile('/', iwad, iwad, true, false);
                
                // If you typed a custom map/mod file, preload that too!
                if (pwad) {
                    FS.createPreloadedFile('/', pwad, pwad, true, false);
                }
            });

            // 2. Build the command line arguments dynamically
            var launchArgs = ["-iwad", iwad, "-window"];
            if (pwad) {
                launchArgs.push("-file", pwad);
            }
            Module.arguments = launchArgs;

            // 3. Dynamically load the engine script to start the game execution
            var script = document.createElement('script');
            script.src = "dsda-doom.js";
            script.async = true;
            document.body.appendChild(script);
        }
    </script>

</body>
</html>

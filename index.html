<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dsda-wasm-doom</title>
    <style>
        @font-face {
            font-family: 'DoomFont';
            src: url('DooM.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body { background-color: #111; color: #fff; font-family: sans-serif; text-align: center; padding: 15px; }
        
        h1 { 
            font-family: 'Doom', sans-serif; 
            font-size: 3.5rem;
            color: #ff3300;
            margin: 10px 0;
            letter-spacing: 2px;
            text-shadow: 3px 3px 0px #550000, 5px 5px 0px #000; 
            text-transform: uppercase; 
        }

        .controls { background: #222; padding: 15px; border-radius: 5px; border: 1px solid #444; display: inline-block; margin-bottom: 15px; }
        input, button { padding: 8px; margin: 5px; background: #333; color: white; border: 1px solid #555; border-radius: 4px; }
        button { background: #a00; cursor: pointer; font-weight: bold; }
        button:hover { background: #c00; }
        #canvas-container { border: 4px solid #333; background: #000; display: inline-block; }
        canvas { display: block; image-rendering: pixelated; width: 100vw; max-width: 854px; height: auto; }
        #output-terminal { width: 854px; height: 120px; margin: 10px auto; background: #000; color: #0f0; font-family: monospace; font-size: 11px; padding: 8px; overflow-y: scroll; white-space: pre-wrap; text-align: left; }
    </style>
</head>
<body>

    <h1>dsda-wasm-doom</h1>
    
    <div class="controls">
        <label>Select IWAD:</label>
        <input type="file" id="iwad-file" accept=".wad"><br>

        <label>Select PWAD (optional):</label>
        <input type="file" id="pwad-file" accept=".wad"><br>

        <button id="launch-btn" onclick="processAndLaunch()">Launch Game</button>
    </div>
    <br>
    
    <div id="canvas-container">
        <canvas id="canvas" width="854" height="480" oncontextmenu="event.preventDefault()"></canvas>
    </div>

    <div id="output-terminal">--- Console ---&#10;</div>

    <script type="text/javascript">
        var terminal = document.getElementById('output-terminal');

        var Module = {
            preRun: [function() {
                FS.createPreloadedFile('/', 'dsda-doom.wad', './dsda-doom.bin', true, false);
            }],
            postRun: [],
            canvas: (function() {
                var canvas = document.getElementById('canvas');
                canvas.addEventListener("click", function() {
                    if(canvas.requestPointerLock) canvas.requestPointerLock();
                });
                return canvas;
            })(),
            print: function(text) { terminal.textContent += text + "\n"; terminal.scrollTop = terminal.scrollHeight; },
            printErr: function(text) { terminal.textContent += "[ERROR] " + text + "\n"; terminal.scrollTop = terminal.scrollHeight; }
        };

        function mountFile(fileElementId, callback) {
            var fileInput = document.getElementById(fileElementId);
            if (fileInput.files.length === 0) {
                callback(null);
                return;
            }
            
            var file = fileInput.files[0];
            var reader = new FileReader();
            
            reader.onload = function(e) {
                var rawBuffer = new Uint8Array(e.target.result);
                FS.writeFile('/' + file.name.toLowerCase(), rawBuffer);
                terminal.textContent += "[WEB] Successfully mounted local file: " + file.name.toLowerCase() + "\n";
                callback(file.name.toLowerCase());
            };
            reader.readAsArrayBuffer(file);
        }

        function processAndLaunch() {
            var iwadInput = document.getElementById('iwad-file');
            if(iwadInput.files.length === 0) {
                alert("Please select an IWAD from your computer first!");
                return;
            }

            document.getElementById('launch-btn').disabled = true;
            terminal.textContent += "[WEB] Initializing Virtual File System...\n";

            mountFile('iwad-file', function(iwadName) {
                mountFile('pwad-file', function(pwadName) {
                    var safeIwad = iwadName.toLowerCase();
                    var safePwad = pwadName ? pwadName.toLowerCase() : null;
            
                    var launchArgs = ["-iwad", safeIwad, "-width", "854", "-height", "480", "-window"];
                    if (safePwad) {
                        launchArgs.push("-file", safePwad);
                    }
                    Module.arguments = launchArgs;

                    terminal.textContent += "[WEB] Downloading engine core assets (dsda-doom.bin)...\n";

                    var script = document.createElement('script');
                    script.src = "dsda-doom.js";
                    script.async = true;
                    document.body.appendChild(script);
                });
            });
        }
    </script>

</body>
</html>
